# Local-dev defaults — preserves the previous out-of-the-box behavior.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:student123}

# Verbose SQL for development
spring.jpa.show-sql=true

# Re-run database/*.sql on every startup (resets local data)
spring.sql.init.mode=always

# DDL is managed by SQL scripts, not Hibernate
spring.jpa.hibernate.ddl-auto=none

# JWT — dev-only fixed secret. MUST be overridden via env var in non-dev environments.
app.jwt.secret=${JWT_SECRET:dev-secret-do-not-use-in-production-please-change-me-now}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
