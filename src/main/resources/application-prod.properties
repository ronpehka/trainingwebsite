# Production: every secret/connection value MUST come from the environment — no defaults.
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET (>= 32 bytes).

# Quiet logging — no SQL on every query
spring.jpa.show-sql=false

# Do NOT re-run import scripts in production
spring.sql.init.mode=never

# Validate that the entity model matches the existing schema; never mutate the schema automatically
spring.jpa.hibernate.ddl-auto=validate

# JWT — fail fast at startup if the secret is missing
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
