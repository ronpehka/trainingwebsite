spring.application.name=trainingwebsite

# Default profile is dev so local-dev runs unchanged. Override with SPRING_PROFILES_ACTIVE=prod in production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource driver and dialect are profile-independent
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
